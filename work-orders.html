<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CFM All Work Orders Recovery</title><style>body{font:15px system-ui;margin:0;background:#f3f7fb;color:#183047}header{background:#075f62;color:white;padding:16px}main{padding:14px;max-width:850px;margin:auto}input,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #a9b9c8}input[type=search]{width:100%;box-sizing:border-box}button{cursor:pointer;background:white}label{display:block;padding:14px;border:2px dashed #7aa2b6;background:white;border-radius:12px;margin:12px 0}.card{background:white;border:1px solid #d5e0e8;border-radius:12px;padding:13px;margin:10px 0}.meta{color:#536779;font-size:13px;margin:6px 0}.pill{background:#e3f5f0;border-radius:5px;padding:3px 6px}.warn{color:#8b4a00}nav{margin:10px 0}a{color:#075f62}small{display:block}</style></head><body><header><b>CFM — All Work Orders</b><small>Safe recovery register · does not modify ERP records</small></header><main><nav><a href="./">← Main CFM ERP</a></nav><p id="status">Loading current saved orders…</p><label><b>📂 Import existing CFM Emergency Backup (.json)</b><small>Select your 16 October backup. Imported work orders are stored on this device, separately from ERP data.</small><input id="file" type="file" accept=".json,application/json"></label><input id="q" type="search" placeholder="Search Work No / Party / Description"><p id="count"></p><button id="export">⬇ Export recovered work order list (CSV)</button><div id="results"></div></main><script>
(function(){
'use strict';
const $=x=>document.getElementById(x), KEY='cfm-recovery-work-orders-v1', records=new Map();
function txt(v){return String(v??'')}
function norm(v){return txt(v).trim().toUpperCase()}
function merge(state,origin){for(const [source,items] of [['pending',state.pending],['cutting',state.cutting],['issueRegister',state.issueRegister]]){if(!Array.isArray(items))continue;for(const r of items){let no=txt(r.workNo||r.workOrder||r.wo).trim();if(!no)continue;if(typeof r.workNo==='number')no='CFM-'+no;const key=norm(no);let o=records.get(key);if(!o){o={no,party:'',description:'',sources:new Set(),pending:0,cutting:0,issue:0,latestStatus:''};records.set(key,o)}o.party=o.party||txt(r.party||r.partyName);o.description=o.description||txt(r.description||r.item);o.sources.add(origin);if(source==='pending'){o.pending++;o.latestStatus=txt(r.status)}else if(source==='cutting')o.cutting++;else o.issue++}}}
function compact(rows){return [...rows.values()].map(o=>({...o,sources:[...o.sources]}))}
function render(){const q=norm($('q').value),all=[...records.values()],hits=all.filter(o=>norm(o.no+' '+o.party+' '+o.description).includes(q)).sort((a,b)=>b.no.localeCompare(a.no,undefined,{numeric:true}));$('count').textContent=all.length+' unique work orders available · '+hits.length+' matching';const dest=$('results');dest.replaceChildren();for(const o of hits.slice(0,600)){const el=document.createElement('div');el.className='card';const title=document.createElement('b');title.textContent=o.no+' — '+o.party;el.append(title);const desc=document.createElement('div');desc.textContent=o.description;el.append(desc);const info=document.createElement('div');info.className='meta';info.textContent='Pending '+o.pending+' · Cutting '+o.cutting+' · Issue '+o.issue+' · '+[...o.sources].join(', ');el.append(info);const link=document.createElement('a');link.href='./';link.textContent='Open main ERP ↗';el.append(link);dest.append(el)}}
function stateFrom(obj){if(obj&&obj.keys&&obj.keys['cfm-plant-tracker-data-v1'])return JSON.parse(obj.keys['cfm-plant-tracker-data-v1']);if(obj&&obj.pending&&obj.cutting)return obj;throw Error('CFM backup data not found')}
try{const saved=JSON.parse(localStorage.getItem(KEY)||'[]');for(const o of saved){o.sources=new Set(o.sources||['Recovered Backup']);records.set(norm(o.no),o)}}catch(e){}
try{const raw=localStorage.getItem('cfm-plant-tracker-data-v1');if(raw)merge(JSON.parse(raw),'Current ERP')}catch(e){}
$('status').textContent=records.size?'Loaded saved work order register.':'No saved orders found on this device. Import your Emergency Backup JSON below.';
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const state=stateFrom(JSON.parse(await f.text()));merge(state,'Recovered Backup');const data=JSON.stringify(compact(records));try{localStorage.setItem(KEY,data);$('status').textContent='Backup imported and recovery register saved on this device.'}catch(err){$('status').textContent='Backup imported for this session, but device storage is full. Export the CSV now.'}render()}catch(err){$('status').textContent='Import failed: '+err.message}e.target.value=''};
$('q').oninput=render;
$('export').onclick=()=>{const cols=['Work No','Party','Description','Pending entries','Cutting entries','Issue entries','Source'];const rows=[cols,...[...records.values()].map(o=>[o.no,o.party,o.description,o.pending,o.cutting,o.issue,[...o.sources].join('; ')])];const csv=rows.map(r=>r.map(v=>'"'+txt(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='CFM-All-Work-Orders.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
render();
})();
</script></body></html>
