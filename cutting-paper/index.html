<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CFM Cutting Paper Entry</title><style>body{font:16px system-ui;background:#eef5fb;color:#123;padding:15px;max-width:650px;margin:auto}section{background:white;padding:18px;border-radius:14px}label{display:block;margin:12px 0 4px}input,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #aac;border-radius:7px}button{padding:12px;margin-top:12px;background:#1674c9;color:white;border:0;border-radius:8px}</style><a href="../index.html">← CFM Tracker</a><h2>Cutting Paper Entry</h2><p>Paper photo and verified cutting details. Main ERP stock is not modified.</p><section><label>Paper photo</label><input type="file" id="photo" accept="image/*" capture="environment"><label>Work No</label><input id="work"><label>SRL No</label><input id="srl"><label>Cloth</label><input id="cloth"><label>Width inch</label><input id="width" type="number"><label>Cut Qty</label><input id="qty" type="number"><label>Used Meter</label><input id="meter" type="number" step="any"><label>Notes</label><textarea id="notes"></textarea><label><input type="checkbox" id="verify" style="width:auto"> Details verified against paper</label><button id="save">Save Draft</button><button id="export">Export JSON</button><p id="status"></p></section><script>
const k='cfm-cutting-paper-drafts-v1',fields=['work','srl','cloth','width','qty','meter','notes'],el=id=>document.getElementById(id);function data(){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch{return []}}
el('save').onclick=()=>{const v=Object.fromEntries(fields.map(f=>[f,el(f).value.trim()]));if(!v.work||!v.srl||!v.cloth||!(+v.qty>0)||!(+v.meter>0)||!el('verify').checked){el('status').textContent='Fill required details and verify first';return}const a=data();a.push({...v,date:new Date().toISOString(),photoName:el('photo').files[0]?.name||''});try{localStorage.setItem(k,JSON.stringify(a));el('status').textContent='Draft saved locally. Main ERP unchanged.'}catch(e){el('status').textContent=e.message}};
el('export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify({app:'CFM Cutting Paper Drafts',rows:data()},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='CFM-Cutting-Drafts.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
</script></html>
