<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CFM Cutting Paper Entry</title><style>body{font:16px system-ui;background:#eef5fb;color:#123;padding:15px;max-width:650px;margin:auto}section{background:white;padding:18px;border-radius:14px}label{display:block;margin:12px 0 4px}input,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #aac;border-radius:7px}button{padding:12px;margin-top:12px;background:#1674c9;color:white;border:0;border-radius:8px}</style><a href="../index.html">← CFM Tracker</a><h2>Cutting Paper Entry</h2><p>Paper photo and verified cutting details. Main ERP stock is not modified.</p><section><label>Cutting Paper Photo</label><button type="button" id="scanBtn">📷 Scan Paper</button><button type="button" id="uploadBtn">🖼 Upload Photo</button><input type="file" id="scanFile" accept="image/*" capture="environment" hidden><input type="file" id="photo" accept="image/*" hidden><p id="photoStatus">No photo selected</p><button type="button" id="readBtn">🔎 Read Photo & Auto Fill (Beta)</button><p id="readStatus" aria-live="polite"></p><label>Recognized text — review carefully</label><textarea id="recognized" rows="5" placeholder="Recognized handwriting will appear here. Correct text if needed."></textarea><button type="button" id="fillBtn">Fill Fields from Text</button><label>Work No</label><input id="work"><label>SRL No</label><input id="srl"><label>Cloth</label><input id="cloth"><label>Width inch</label><input id="width" type="number"><label>Cut Qty</label><input id="qty" type="number"><label>Used Meter</label><input id="meter" type="number" step="any"><label>Notes</label><textarea id="notes"></textarea><label><input type="checkbox" id="verify" style="width:auto"> Details verified against paper</label><button id="save">Save Draft</button><button id="export">Export JSON</button><p id="status"></p></section><script>
const k='cfm-cutting-paper-drafts-v1',fields=['work','srl','cloth','width','qty','meter','notes'],el=id=>document.getElementById(id);function data(){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch{return []}}
el('scanBtn').onclick=()=>el('scanFile').click();el('uploadBtn').onclick=()=>el('photo').click();el('scanFile').onchange=()=>{if(el('scanFile').files[0])el('photoStatus').textContent='Scanned: '+el('scanFile').files[0].name};el('photo').onchange=()=>{if(el('photo').files[0])el('photoStatus').textContent='Uploaded: '+el('photo').files[0].name};el('readBtn').onclick=async()=>{const f=el('scanFile').files[0]||el('photo').files[0];if(!f){el('readStatus').textContent='Select a photo first';return}el('readBtn').disabled=true;el('readStatus').textContent='Loading OCR (internet needed)...';try{if(!window.Tesseract){await new Promise((ok,fail)=>{const a=document.createElement('script');a.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';a.onload=ok;a.onerror=()=>fail(Error('OCR library unavailable; check internet'));document.head.appendChild(a)})}el('readStatus').textContent='Reading photo, please wait...';const out=await Tesseract.recognize(f,'eng');el('recognized').value=out.data.text||'';el('readStatus').textContent='OCR complete. Handwriting may be inaccurate. Check every field before saving.';fill()}catch(e){el('readStatus').textContent='Could not read photo: '+e.message+' — manual entry is available.'}finally{el('readBtn').disabled=false}};
function fill(){const text=el('recognized').value;const match=(re)=>text.match(re)?.[1]?.trim()||'';const vals={work:match(/(?:work\\s*(?:order)?\\s*(?:no|number)?|CFM)\\s*[:#-]?\\s*(CFM[-\\s]*\\d+|\\d{2,6})/i),srl:match(/(?:SRL|serial|roll)\\s*(?:no)?\\s*[:#-]?\\s*([A-Z0-9\\/-]+)/i),cloth:match(/(?:cloth|material)\\s*[:#-]?\\s*([A-Z0-9 ]+)/i),width:match(/(?:width|wdth)\\s*[:#-]?\\s*(\\d+(?:\\.\\d+)?)/i),qty:match(/(?:qty|quantity|nos|pieces|cut)\\s*[:#-]?\\s*(\\d+)/i),meter:match(/(?:used\\s*)?(?:meter|metre|mtr|mtrs)\\s*[:#-]?\\s*(\\d+(?:\\.\\d+)?)/i)};for(const [k,v] of Object.entries(vals))if(v)el(k).value=v;el('verify').checked=false;el('readStatus').textContent='Auto Fill attempted. Review Work No, SRL, Qty and Meter against original paper before checking verification.'}
el('fillBtn').onclick=fill;
el('save').onclick=()=>{const v=Object.fromEntries(fields.map(f=>[f,el(f).value.trim()]));if(!v.work||!v.srl||!v.cloth||!(+v.qty>0)||!(+v.meter>0)||!el('verify').checked){el('status').textContent='Fill required details and verify first';return}const a=data();a.push({...v,date:new Date().toISOString(),photoName:(el('scanFile').files[0]||el('photo').files[0])?.name||''});try{localStorage.setItem(k,JSON.stringify(a));el('status').textContent='Draft saved locally. Main ERP unchanged.'}catch(e){el('status').textContent=e.message}};
el('export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify({app:'CFM Cutting Paper Drafts',rows:data()},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='CFM-Cutting-Drafts.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
</script></html>
