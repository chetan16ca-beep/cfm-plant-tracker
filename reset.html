<!doctype html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>CFM Reset</title>
<style>body{font-family:system-ui;background:#eef3f8;display:grid;place-items:center;height:100vh;margin:0}.box{background:#fff;padding:24px;border-radius:16px;box-shadow:0 8px 30px #0002;text-align:center}</style>
</head><body><div class="box"><b>CFM Plant Tracker</b><div id="s" style="margin-top:10px">Refreshing app…</div></div>
<script>
(async()=>{
 try{
  if('serviceWorker' in navigator){
   const regs=await navigator.serviceWorker.getRegistrations();
   await Promise.all(regs.map(r=>r.unregister()));
  }
  if('caches' in window){
   const keys=await caches.keys();
   await Promise.all(keys.map(k=>caches.delete(k)));
  }
  document.getElementById('s').textContent='Cache cleared. Opening fresh version…';
 }catch(e){
  document.getElementById('s').textContent='Opening fresh version…';
 }
 setTimeout(()=>location.replace('./?fresh=53-'+Date.now()),700);
})();
</script></body></html>
