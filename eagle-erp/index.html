<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eagle ERP</title><style>body{font:15px system-ui;background:#f3f7fa;margin:0;color:#123}header{background:#15416a;color:#fff;padding:18px}main{max-width:930px;margin:auto;padding:15px}section{background:#fff;border-radius:12px;border:1px solid #d6e1eb;padding:15px;margin:12px 0}label{display:block;margin:9px 0}input{display:block;padding:10px;width:95%;border:1px solid #aaa;border-radius:7px}button{padding:11px;background:#176ba8;color:#fff;border:0;border-radius:8px;margin:5px}.hidden{display:none}</style></head><body><header><h2>Eagle ERP</h2>New Work Orders start at CFM-685. Old CFM ERP unaffected.</header><main><p id="status">Connecting...</p><section id="auth"><h3>Secure Login</h3><label>Email<input id="email" type="email"></label><label>Password<input id="password" type="password"></label><button id="login">Sign In</button><button id="signup">Create Account</button></section><div id="workspace" class="hidden"><section><h3>Dashboard</h3><p id="summary"></p><button id="reload">Refresh Cloud</button><button id="logout">Logout</button></section><section><h3>Work Orders</h3><form id="form"><label>Party<input name="party" required></label><label>PO Number<input name="po_no"></label><label>Product<input name="description" required></label><label>Quantity<input name="qty" type="number" min="1" required></label><label>Cloth<input name="cloth"></label><button id="save">Save Work Order</button></form><div id="orders"></div></section></div></main><script src="./app.js?v=1"></script></body></html>
