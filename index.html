<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101820"><title>CFM Plant Tracker</title><link rel="manifest" href="/manifest.json">
<style>html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#eef3f8}#app{border:0;display:block}.load{position:fixed;inset:0;display:grid;place-items:center;font-family:system-ui;color:#182433}.box{background:#fff;padding:24px;border-radius:16px;box-shadow:0 8px 30px #0002;text-align:center}</style></head>
<body><div class="load" id="load"><div class="box"><b>CFM Plant Tracker</b><div id="st" style="margin-top:8px">Loading…</div></div></div><iframe id="app" title="CFM Plant Tracker"></iframe>
<script>
const groups=[["chunks/s1-000.txt"],["chunks/s2-000.txt","chunks/s2-001.txt","chunks/s2-002.txt","chunks/s2-003.txt","chunks/s2-004.txt","chunks/s2-005.txt","chunks/s2-006.txt","chunks/s2-007.txt","chunks/s2-008.txt"],["chunks/s3-000.txt","chunks/s3-001.txt"],["chunks/s4-000.txt","chunks/s4-001.txt","chunks/s4-002.txt","chunks/s4-003.txt","chunks/s4-004.txt","chunks/s4-005.txt","chunks/s4-006.txt","chunks/s4-007.txt","chunks/s4-008.txt","chunks/s4-009.txt","chunks/s4-010.txt","chunks/s4-011.txt","chunks/s4-012.txt","chunks/s4-013.txt","chunks/s4-014.txt"]];
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
(async()=>{
 let parts=[],done=0,total=groups.flat().length,st=document.getElementById('st');
 for(const g of groups){const x=await Promise.all(g.map(async u=>{const r=await fetch('/'+u+'?v=47');if(!r.ok)throw Error(u);done++;st.textContent='Loading '+done+'/'+total;return r.text()}));parts.push(x.join(''))}
 let src=parts.join('')+'\n';
 src=src.replaceAll('icons/icon-192.png','/icons/icon-192.svg').replaceAll('icons/icon-512.png','/icons/icon-512.svg');
 const base='<base href="'+location.origin+'/">';
 src=src.replace('<head>','<head>'+base);
 const frame=document.getElementById('app');
 frame.addEventListener('load',()=>document.getElementById('load')?.remove(),{once:true});
 frame.srcdoc=src;
})().catch(e=>{document.getElementById('st').textContent='Load failed: '+e.message});
</script></body></html>
