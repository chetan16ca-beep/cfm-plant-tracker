<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101820">
<title>CFM Plant Tracker</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<style>
html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#eef3f8;color:#182433}
.wrap{height:100%;display:grid;place-items:center;text-align:center;padding:24px}
.card{background:#fff;padding:28px;border-radius:18px;box-shadow:0 10px 30px rgba(28,59,88,.12);max-width:420px;width:100%}
.spinner{width:42px;height:42px;border:5px solid #d6e0e9;border-top-color:#1f4e79;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}h1{font-size:20px;margin:0 0 8px}p{margin:0;color:#667586;font-size:14px}
</style>
</head>
<body>
<div class="wrap"><div class="card"><div class="spinner"></div><h1>CFM Plant Tracker</h1><p id="status">Loading ERP data…</p></div></div>
<script>
const chunks=["chunks/s1-000.txt","chunks/s2-000.txt","chunks/s2-001.txt","chunks/s2-002.txt","chunks/s2-003.txt","chunks/s2-004.txt","chunks/s2-005.txt","chunks/s2-006.txt","chunks/s2-007.txt","chunks/s2-008.txt","chunks/s3-000.txt","chunks/s3-001.txt","chunks/s4-000.txt","chunks/s4-001.txt","chunks/s4-002.txt","chunks/s4-003.txt","chunks/s4-004.txt","chunks/s4-005.txt","chunks/s4-006.txt","chunks/s4-007.txt","chunks/s4-008.txt","chunks/s4-009.txt","chunks/s4-010.txt","chunks/s4-011.txt","chunks/s4-012.txt","chunks/s4-013.txt","chunks/s4-014.txt"];
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
(async()=>{
  const status=document.getElementById('status');
  const parts=await Promise.all(chunks.map(async (u,i)=>{
    const r=await fetch(u);
    if(!r.ok) throw new Error('Missing app file: '+u);
    status.textContent='Loading ERP data… '+(i+1)+'/'+chunks.length;
    return await r.text();
  }));
  const source=parts.join('');
  document.open();
  document.write(source);
  document.close();
})().catch(err=>{
  document.getElementById('status').textContent='App load failed. Internet on karke Refresh karein. '+err.message;
  console.error(err);
});
</script>
</body>
</html>
