name: Deploy CFM PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  safety:
    name: Read-only ERP safety smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Work Order, Store, Cutting, SOP and backup files
        run: node --test tests/erp-safety.test.mjs tests/cloud-sync-hotfix.test.mjs
      - name: Report pre-existing label and packing test drift (not part of Cloud sync fix)
        continue-on-error: true
        run: node --test tests/label-design-lock.test.mjs tests/packing-slip-format.test.mjs

  deploy:
    needs: safety
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
