<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CFM Physical Store</title><style>body{font:15px system-ui;margin:0;background:#f3f7fb;color:#18334c}header{background:#1469a7;color:white;padding:20px}main{max-width:1100px;margin:auto;padding:15px}.card{background:white;border:1px solid #dce8f0;border-radius:12px;padding:14px;margin:12px 0}input{padding:12px;border:1px solid #bdd0df;border-radius:8px;width:90%}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;border-bottom:1px solid #e3ebf1;padding:9px 5px}th{background:#eaf4fa}button,a{background:#1469a7;color:white;border:0;border-radius:8px;padding:10px 13px;text-decoration:none;display:inline-block;margin:4px;cursor:pointer}.scroll{overflow:auto;max-height:70vh}.note{color:#845500}</style></head><body><header><b>CFM • PHYSICAL STOCK STORE</b><p>Photo-based separate register • original ERP untouched</p></header><main><a href="./">Main ERP</a><button onclick="download()">Export CSV</button><div class="card"><b id="total">Loading...</b><p class="note">Staging register only. Not yet active for work order issue or cutting. Missing meter quantities remain blank. Please verify duplicate SRL and handwritten codes.</p><input id="search" placeholder="Search SRL / cloth / width" oninput="render()"></div><div class="card scroll"><table><thead><tr><th>SRL</th><th>Width</th><th>Meter</th><th>Cloth</th><th>Page</th></tr></thead><tbody id="items"></tbody></table></div></main><script>const pages=['26','27','28','03','04'];let rows=[];async function start(){for(let p of pages){let r=await fetch('./physical-store/photo-page-'+p+'.csv',{cache:'no-store'});if(!r.ok)continue;let t=await r.text();for(let line of t.trim().split(/\r?\n/).slice(1)){let c=line.split(',');if(c.length>=4)rows.push([...c.slice(0,4),p])}}render()}function render(){let q=document.getElementById('search').value.toLowerCase();document.getElementById('total').textContent=rows.length+' physical photo rows';document.getElementById('items').innerHTML=rows.filter(r=>r.join(' ').toLowerCase().includes(q)).map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')}function download(){let text=['SRL,Width,Meter,Cloth,Page',...rows.map(r=>r.join(','))].join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));a.download='CFM-Physical-Store.csv';a.click()}start()</script></body></html>
