<!doctype html><html><head><meta charset="utf-8"><title>CFM Cutting Print Test</title><style>@page{size:A4;margin:9mm}body{font:12px Arial;margin:0;color:#111}.toolbar{padding:12px;background:#eef}button{padding:8px}article{height:67mm;border:1px solid #555;box-sizing:border-box;margin-bottom:2mm;padding:3mm;break-inside:avoid}header{display:flex;justify-content:space-between;font-weight:bold;font-size:14px}.meta{margin:5px 0}.qty{display:flex;justify-content:space-between;border:1px solid #999;padding:5px}table{width:100%;border-collapse:collapse;margin-top:5px}td,th{border:1px solid #888;height:19px;text-align:center}th{background:#eee}.note{font-size:10px;margin-top:4px}@media print{.toolbar{display:none}}</style></head><body><div class="toolbar">CFM TEST ONLY — Sample data, not connected to live ERP. <button onclick="print()">Print A4</button></div><main id="page"></main><script>const orders=[{no:"CFM-603",party:"Sample party",quality:"333 ANT",width:50,qty:10,previous:5},{no:"CFM-604",party:"Sample party",quality:"333 ANT",width:50,qty:8,previous:0},{no:"CFM-608",party:"Sample party",quality:"333 ANT",width:50,qty:12,previous:4},{no:"CFM-612",party:"Sample party",quality:"333 ANT",width:50,qty:6,previous:0}];document.querySelector("#page").innerHTML=orders.filter(o=>o.qty-o.previous>0).map(o=>`<article><header><span>WORK ORDER: ${o.no}</span><span>Date: __________</span></header><div class="meta">Party: ${o.party} &nbsp; Cloth: ${o.quality} &nbsp; Roll Width: ${o.width} inch</div><div class="qty"><span>Order Qty: <b>${o.qty}</b></span><span>Previous Cut: <b>${o.previous}</b></span><span>Today Cut: ______</span><span>Pending Before Today: <b>${o.qty-o.previous}</b></span></div><table><thead><tr><th>Serial No.</th><th>Part</th><th>Width (inch)</th><th>Length (inch)</th><th>Pieces</th><th>Used Meter</th></tr></thead><tbody>${Array.from({length:5},()=>'<tr><td>&nbsp;</td><td></td><td></td><td></td><td></td><td></td></tr>').join('')}</tbody></table><div class="note">CUTTING: RED PEN ONLY. Other pen colours will not be entered. Pending after today = Order Qty − Previous Cut − Today Completed Bags. Each serial requires separate verified meter usage.</div></article>`).join("");</script></body></html>
